<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSOFT · Portal AI Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D92B2B;
    --red-dark: #B01E1E;
    --red-light: #FDEAEA;
    --navy: #1A2540;
    --navy-mid: #243356;
    --slate: #4A5568;
    --muted: #8896AA;
    --border: #E2E8F0;
    --bg: #F7F9FC;
    --white: #FFFFFF;
    --green: #16A34A;
    --green-bg: #DCFCE7;
    --yellow: #D97706;
    --yellow-bg: #FEF3C7;
    --blue: #2563EB;
    --blue-bg: #DBEAFE;
    --pending-color: #94A3B8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--navy);
    min-height: 100vh;
  }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--navy);
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 2px solid var(--red);
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-logo {
    font-size: 18px;
    font-weight: 600;
    color: white;
    letter-spacing: -0.3px;
  }

  .topbar-logo span { color: var(--red); }

  .topbar-divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.2);
  }

  .topbar-subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .topbar-meta {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .badge-ola {
    background: var(--red);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .badge-fase {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* ── LAYOUT ── */
  .app-layout {
    display: flex;
    height: calc(100vh - 56px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    background: var(--white);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 20px 0;
  }

  .sidebar-section {
    margin-bottom: 8px;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 16px;
    margin-bottom: 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--slate);
    border-left: 3px solid transparent;
  }

  .nav-item:hover { background: var(--bg); color: var(--navy); }

  .nav-item.active {
    background: var(--red-light);
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
  }

  .nav-item .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }

  .nav-item.active .dot { background: var(--red); }

  .sidebar-separator {
    height: 1px;
    background: var(--border);
    margin: 12px 16px;
  }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
  }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── PAGE HEADER ── */
  .page-header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .page-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: -0.4px;
  }

  .page-subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* ── DASHBOARD ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .kpi-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: -1px;
    font-family: 'DM Mono', monospace;
  }

  .kpi-value.red { color: var(--red); }

  .kpi-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── CLIENTE CARDS ── */
  .clientes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .cliente-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .cliente-card:hover {
    border-color: var(--red);
    box-shadow: 0 4px 12px rgba(217, 43, 43, 0.08);
  }

  .cliente-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .cliente-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--navy);
  }

  .cliente-gerente {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .progress-bar-wrap {
    background: var(--bg);
    border-radius: 20px;
    height: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 20px;
    transition: width 0.5s ease;
  }

  .progress-stats {
    display: flex;
    gap: 12px;
    font-size: 11.5px;
    color: var(--muted);
  }

  .stat-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* ── TRACKER VIEW ── */
  .tracker-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .btn-back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--white);
    color: var(--slate);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .btn-back:hover { border-color: var(--navy); color: var(--navy); }

  .tracker-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--navy);
  }

  .fase-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .fase-tab {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--white);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    color: var(--slate);
    transition: all 0.15s;
    font-weight: 500;
  }

  .fase-tab:hover { border-color: var(--navy); color: var(--navy); }

  .fase-tab.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
    font-weight: 600;
  }

  .fase-tab.current-badge::after {
    content: '●';
    color: var(--red);
    margin-left: 6px;
    font-size: 8px;
    vertical-align: middle;
  }

  /* ── FASE PANEL ── */
  .fase-panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .fase-panel-header {
    background: var(--navy);
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .fase-panel-title {
    color: white;
    font-size: 15px;
    font-weight: 600;
  }

  .fase-panel-sub {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-top: 2px;
  }

  .fase-panel-stats {
    display: flex;
    gap: 8px;
  }

  .mini-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }

  .mb-green { background: var(--green-bg); color: var(--green); }
  .mb-yellow { background: var(--yellow-bg); color: var(--yellow); }
  .mb-gray { background: var(--bg); color: var(--muted); }

  /* ── TAREAS ── */
  .tareas-list {
    padding: 6px 0;
  }

  .tarea-row {
    display: flex;
    align-items: center;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    transition: background 0.1s;
  }

  .tarea-row:last-child { border-bottom: none; }
  .tarea-row:hover { background: var(--bg); }

  .tarea-texto {
    flex: 1;
    font-size: 14px;
    color: var(--navy);
  }

  .tarea-texto.done {
    text-decoration: line-through;
    color: var(--muted);
  }

  .estado-select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    background: var(--white);
    transition: all 0.15s;
    min-width: 120px;
  }

  .estado-select.Pendiente { color: var(--pending-color); border-color: var(--border); }
  .estado-select.En-curso { color: var(--yellow); border-color: var(--yellow); background: var(--yellow-bg); }
  .estado-select.Completado { color: var(--green); border-color: var(--green); background: var(--green-bg); }

  .btn-delete {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    background: none;
    color: var(--border);
    font-size: 14px;
    transition: all 0.15s;
  }

  .btn-delete:hover { background: #FEF2F2; color: var(--red); border-color: #FECACA; }

  /* ── ADD TAREA ── */
  .add-tarea-wrap {
    padding: 12px 22px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .add-tarea-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 14px;
    font-size: 13.5px;
    font-family: inherit;
    background: var(--white);
    color: var(--navy);
    outline: none;
    transition: border-color 0.15s;
  }

  .add-tarea-input:focus { border-color: var(--navy); }
  .add-tarea-input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }

  .btn-add:hover { background: var(--red-dark); }

  /* ── INFO CLIENTE ── */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }

  .info-field {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .info-field.full { grid-column: 1 / -1; }

  .info-field-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .info-field-value {
    font-size: 13.5px;
    color: var(--navy);
    background: none;
    border: none;
    width: 100%;
    font-family: inherit;
    outline: none;
    resize: none;
    line-height: 1.5;
  }

  .info-field-value:focus {
    background: var(--bg);
    border-radius: 4px;
    padding: 4px 6px;
    margin: -4px -6px;
  }

  /* ── LOADING ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    color: var(--muted);
    gap: 10px;
    font-size: 14px;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    z-index: 999;
    pointer-events: none;
    border-left: 3px solid var(--red);
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* ── SETUP BANNER ── */
  .setup-banner {
    background: var(--yellow-bg);
    border: 1px solid #FCD34D;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .setup-banner-text { font-size: 13.5px; color: var(--navy); }
  .setup-banner-text strong { color: var(--yellow); }

  .btn-init {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .btn-init:hover { background: var(--navy-mid); }

  /* ── NIVEL BADGE ── */
  .nivel-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
    font-family: 'DM Mono', monospace;
  }

  .nivel-C1 { background: #FEF2F2; color: #DC2626; }
  .nivel-C2 { background: var(--yellow-bg); color: var(--yellow); }
  .nivel-C3 { background: var(--blue-bg); color: var(--blue); }
  .nivel-P1 { background: #FEF2F2; color: #DC2626; }
  .nivel-P2 { background: var(--yellow-bg); color: var(--yellow); }
  .nivel-P3 { background: var(--green-bg); color: var(--green); }

  /* ── CHAMPIONS ── */
  .champions-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .champion-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 10px;
  }
  .champion-nombre {
    flex: 1; border: none; background: none; font-family: inherit;
    font-size: 13px; color: var(--navy); outline: none;
  }
  .champion-nombre::placeholder { color: var(--muted); }
  .champion-rol {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
    font-size: 12px; font-family: inherit; background: var(--white);
    color: var(--slate); outline: none; cursor: pointer;
  }
  .champion-del {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--muted); cursor: pointer;
    border-radius: 5px; font-size: 13px; transition: all 0.15s; flex-shrink: 0;
  }
  .champion-del:hover { background: #FEF2F2; color: var(--red); }
  .btn-add-champion {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border: 1px dashed var(--border); border-radius: 7px;
    background: none; color: var(--muted); font-size: 12.5px; font-family: inherit;
    cursor: pointer; transition: all 0.15s; width: 100%;
  }
  .btn-add-champion:hover { border-color: var(--navy); color: var(--navy); background: var(--bg); }

  /* ── SAVE INDICATOR ── */
  .field-saved {
    font-size: 11px; color: var(--green); font-weight: 600;
    opacity: 0; transition: opacity 0.3s; margin-top: 4px;
  }
  .field-saved.show { opacity: 1; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">TSOFT<span>▶</span></div>
    <div class="topbar-divider"></div>
    <div class="topbar-subtitle">AI Program · Portal de Seguimiento</div>
  </div>
  <div class="topbar-meta">
    <span class="badge-ola" id="badge-ola">OLA 1</span>
    <span class="badge-fase" id="badge-fase">Fase 1 · Semana 1</span>
  </div>
</div>

<!-- APP LAYOUT -->
<div class="app-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Navegación</div>
      <div class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard">
        <span class="dot"></span> Dashboard
      </div>
    </div>
    <div class="sidebar-separator"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">OLA 1 — Clientes</div>
      <div class="nav-item" onclick="openTracker('Correo Argentino')" id="nav-Correo Argentino">
        <span class="dot"></span> Correo Argentino
      </div>
      <div class="nav-item" onclick="openTracker('Tuenti')" id="nav-Tuenti">
        <span class="dot"></span> Tuenti
      </div>
      <div class="nav-item" onclick="openTracker('AM')" id="nav-AM">
        <span class="dot"></span> AM
      </div>
      <div class="nav-item" onclick="openTracker('Claro')" id="nav-Claro">
        <span class="dot"></span> Claro
      </div>
      <div class="nav-item" onclick="openTracker('Claro Automatización')" id="nav-Claro Automatización">
        <span class="dot"></span> Claro Automatización
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">

    <!-- DASHBOARD VIEW -->
    <div class="view active" id="view-dashboard">
      <div class="page-header">
        <div>
          <div class="page-title">Dashboard · Ola 1</div>
          <div class="page-subtitle">Estado general del programa — Argentina 2026</div>
        </div>
      </div>

      <div id="setup-banner-container"></div>

      <div class="kpi-grid" id="kpi-grid">
        <div class="loading"><div class="spinner"></div> Cargando...</div>
      </div>

      <div class="clientes-grid" id="clientes-grid">
      </div>
    </div>

    <!-- TRACKER VIEW -->
    <div class="view" id="view-tracker">
      <div class="tracker-header">
        <button class="btn-back" onclick="showView('dashboard')">← Volver</button>
        <div class="tracker-title" id="tracker-title">—</div>
      </div>

      <div class="fase-tabs" id="fase-tabs"></div>

      <div id="fase-panel-container">
        <div class="loading"><div class="spinner"></div> Cargando tareas...</div>
      </div>
    </div>

  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG — REEMPLAZÁ ESTA URL CUANDO PUBLIQUES EL SCRIPT
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwI70OzecMBOgUD4E4bp8vxRd7FHCxE1iuw1tkqlVtu4uveMZvfJX16IYo0VCHS2jov-w/exec';

// Estado local
let state = {
  currentOla: 'Ola 1',
  currentFase: 1,
  currentCliente: null,
  tareas: {},
  resumen: {},
  clientesInfo: {},
  initialized: false
};

const FASES = [
  { id: 1, nombre: 'Fase 1', periodo: 'Semana 1', subtitulo: 'Lanzamiento del programa' },
  { id: 2, nombre: 'Fase 2', periodo: 'Semanas 2–3', subtitulo: 'Champions' },
  { id: 3, nombre: 'Fase 3', periodo: 'Semanas 4–5', subtitulo: 'Todo el equipo' },
  { id: 4, nombre: 'Fase 4', periodo: 'En curso', subtitulo: 'Consolidación' }
];

const CLIENTES = ['Correo Argentino', 'Tuenti', 'AM', 'Claro', 'Claro Automatización'];

// ============================================================
// API
// ============================================================
// JSONP — funciona desde file:// y GitHub Pages sin CORS
let _jsonpCounter = 0;

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cbName = '_tsoftCb' + (++_jsonpCounter);
    const timeout = setTimeout(() => {
      delete window[cbName];
      reject(new Error('JSONP timeout'));
    }, 10000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      document.getElementById('_jsonp_' + cbName) && document.getElementById('_jsonp_' + cbName).remove();
      resolve(data);
    };

    const url = new URL(API_URL);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    url.searchParams.set('callback', cbName);

    const script = document.createElement('script');
    script.id = '_jsonp_' + cbName;
    script.src = url.toString();
    script.onerror = () => { clearTimeout(timeout); delete window[cbName]; reject(new Error('JSONP error')); };
    document.head.appendChild(script);
  });
}

async function api(params) {
  return jsonp(params);
}

// Para escrituras usamos también JSONP (GET con acción)
async function apiPost(body) {
  return jsonp(body);
}

let mockIdCounter = 100;
function mockPost(body) {
  if (body.action === 'actualizarEstado') {
    CLIENTES.forEach(c => {
      Object.values(mockTareasData[c]).forEach(arr => {
        const t = arr.find(x => x.id === body.tareaId);
        if (t) t.estado = body.estado;
      });
    });
    return { success: true };
  }
  if (body.action === 'agregarTarea') {
    const id = `${body.cliente}_f${body.faseId}_custom_${++mockIdCounter}`;
    if (!mockTareasData[body.cliente]) mockTareasData[body.cliente] = {};
    if (!mockTareasData[body.cliente][body.faseId]) mockTareasData[body.cliente][body.faseId] = [];
    mockTareasData[body.cliente][body.faseId].push({ id, texto: body.texto, estado: 'Pendiente', notas: '' });
    return { success: true, id };
  }
  if (body.action === 'eliminarTarea') {
    CLIENTES.forEach(c => {
      Object.keys(mockTareasData[c]).forEach(f => {
        mockTareasData[c][f] = mockTareasData[c][f].filter(x => x.id !== body.tareaId);
      });
    });
    return { success: true };
  }
  return { success: true };
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');

  if (name === 'dashboard') loadDashboard();
}

async function openTracker(cliente) {
  state.currentCliente = cliente;
  state.currentFase = 1;

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-tracker').classList.add('active');

  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + cliente);
  if (navEl) navEl.classList.add('active');

  document.getElementById('tracker-title').textContent = cliente;

  renderFaseTabs();
  await loadTareas(cliente);
}

async function loadDashboard() {
  document.getElementById('kpi-grid').innerHTML = '<div class="loading"><div class="spinner"></div> Cargando...</div>';

  const [resumen, clientesInfo] = await Promise.all([
    api({ action: 'getResumen' }),
    api({ action: 'getClientesInfo' })
  ]);

  state.resumen = resumen;
  state.clientesInfo = clientesInfo;

  // KPIs
  const totalTareas = Object.values(resumen).reduce((a, c) => a + c.total, 0);
  const totalCompletadas = Object.values(resumen).reduce((a, c) => a + c.completadas, 0);
  const totalEnCurso = Object.values(resumen).reduce((a, c) => a + c.enCurso, 0);
  const pctGlobal = totalTareas > 0 ? Math.round((totalCompletadas / totalTareas) * 100) : 0;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Avance global</div>
      <div class="kpi-value red">${pctGlobal}%</div>
      <div class="kpi-sub">${totalCompletadas} de ${totalTareas} tareas</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Clientes Ola 1</div>
      <div class="kpi-value">${CLIENTES.length}</div>
      <div class="kpi-sub">activos en programa</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">En curso</div>
      <div class="kpi-value">${totalEnCurso}</div>
      <div class="kpi-sub">tareas activas</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Fase actual</div>
      <div class="kpi-value">F1</div>
      <div class="kpi-sub">Semana 1 · Lanzamiento</div>
    </div>
  `;

  // Cliente cards
  const grid = document.getElementById('clientes-grid');
  grid.innerHTML = CLIENTES.map(cliente => {
    const r = resumen[cliente] || { total: 12, completadas: 0, enCurso: 0, pendientes: 12, pct: 0 };
    const info = clientesInfo[cliente] || {};
    const pct = r.pct || 0;
    const semaforo = pct === 100 ? '#16A34A' : pct > 0 ? '#D97706' : '#94A3B8';

    return `
      <div class="cliente-card" onclick="openTracker('${cliente}')">
        <div class="cliente-card-header">
          <div>
            <div class="cliente-name">${cliente}</div>
            <div class="cliente-gerente">${info.gerente ? '👤 ' + info.gerente : 'Sin gerente asignado'}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
            ${info.nivelC ? `<span class="nivel-badge nivel-${info.nivelC.split('–')[0].replace(/[^CP0-9]/g,'')}">${info.nivelC}</span>` : ''}
            ${info.nivelP ? `<span class="nivel-badge nivel-${info.nivelP.split(' ')[0].replace(/[^CP0-9]/g,'')}">${info.nivelP}</span>` : ''}
          </div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width:${pct}%;background:${semaforo}"></div>
        </div>
        <div class="progress-stats">
          <span><span class="stat-dot" style="background:var(--green)"></span>${r.completadas} completadas</span>
          <span><span class="stat-dot" style="background:var(--yellow)"></span>${r.enCurso} en curso</span>
          <span><span class="stat-dot" style="background:var(--border)"></span>${r.pendientes} pendientes</span>
        </div>
        ${info.proximoPaso ? `<div style="margin-top:10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px">→ ${info.proximoPaso}</div>` : ''}
      </div>

function renderFaseTabs() {
  const tabs = document.getElementById('fase-tabs');
  tabs.innerHTML = FASES.map(f => `
    <button class="fase-tab ${f.id === state.currentFase ? 'active' : ''} ${f.id === 1 ? 'current-badge' : ''}"
      onclick="switchFase(${f.id})">
      ${f.nombre} · ${f.periodo}
    </button>
  `).join('');
}

function switchFase(faseId) {
  state.currentFase = faseId;
  renderFaseTabs();
  renderFasePanel();
}

async function loadTareas(cliente) {
  document.getElementById('fase-panel-container').innerHTML = '<div class="loading"><div class="spinner"></div> Cargando tareas...</div>';

  const tareas = await api({ action: 'getTareas', ola: state.currentOla, cliente });
  state.tareas[cliente] = tareas;

  renderFasePanel();
}

function renderFasePanel() {
  const cliente = state.currentCliente;
  const faseId = state.currentFase;
  const fase = FASES.find(f => f.id === faseId);
  const tareas = (state.tareas[cliente] || {})[faseId] || [];

  const completadas = tareas.filter(t => t.estado === 'Completado').length;
  const enCurso = tareas.filter(t => t.estado === 'En curso').length;
  const pendientes = tareas.filter(t => t.estado === 'Pendiente').length;

  const tareasHTML = tareas.map(t => `
    <div class="tarea-row" id="tarea-${t.id}">
      <div class="tarea-texto ${t.estado === 'Completado' ? 'done' : ''}" id="texto-${t.id}">${t.texto}</div>
      <select class="estado-select ${t.estado.replace(' ', '-')}" onchange="cambiarEstado('${t.id}', this.value, this)" data-tarea="${t.id}">
        <option ${t.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
        <option ${t.estado === 'En curso' ? 'selected' : ''}>En curso</option>
        <option ${t.estado === 'Completado' ? 'selected' : ''}>Completado</option>
      </select>
      <button class="btn-delete" onclick="eliminarTarea('${t.id}')" title="Eliminar">✕</button>
    </div>
  `).join('');

  document.getElementById('fase-panel-container').innerHTML = `
    <div class="fase-panel">
      <div class="fase-panel-header">
        <div>
          <div class="fase-panel-title">${fase.nombre} · ${fase.periodo}</div>
          <div class="fase-panel-sub">${fase.subtitulo}</div>
        </div>
        <div class="fase-panel-stats">
          <span class="mini-badge mb-green">${completadas} ✓</span>
          <span class="mini-badge mb-yellow">${enCurso} ↻</span>
          <span class="mini-badge mb-gray">${pendientes} ·</span>
        </div>
      </div>
      <div class="tareas-list">
        ${tareasHTML || '<div style="padding:20px 22px;color:var(--muted);font-size:13px">Sin tareas. Agregá la primera abajo.</div>'}
      </div>
      <div class="add-tarea-wrap">
        <input type="text" class="add-tarea-input" id="nueva-tarea-input" placeholder="Agregar nueva tarea..." onkeydown="if(event.key==='Enter')agregarTarea()">
        <button class="btn-add" onclick="agregarTarea()">+ Agregar</button>
      </div>
    </div>

    <!-- Info del cliente -->
    <div style="margin-top:24px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px">Ficha del cliente</div>
      ${renderInfoCliente()}
    </div>
  `;
}

const ROLES_CHAMPION = ['Dev Frontend','Dev Backend','QA','PO','PM','Analista Funcional','UX/UI','DevOps','Tech Lead','Otro'];

function parseChampions(val) {
  if (!val) return [];
  try { return JSON.parse(val); } catch(e) {
    // legacy: plain text
    return val ? [{ nombre: val, rol: 'Otro' }] : [];
  }
}

function renderChampionsEditor(champions) {
  const rows = champions.map((c, i) => `
    <div class="champion-row" id="champ-row-${i}">
      <input class="champion-nombre" value="${c.nombre || ''}" placeholder="Nombre del champion"
        onblur="updateChampion(${i}, 'nombre', this.value)">
      <select class="champion-rol" onchange="updateChampion(${i}, 'rol', this.value)">
        ${ROLES_CHAMPION.map(r => `<option ${c.rol === r ? 'selected' : ''}>${r}</option>`).join('')}
      </select>
      <button class="champion-del" onclick="removeChampion(${i})" title="Eliminar">✕</button>
    </div>
  `).join('');
  return `
    <div class="champions-list" id="champions-list">${rows}</div>
    <button class="btn-add-champion" onclick="addChampion()">+ Agregar champion</button>
    <div class="field-saved" id="champ-saved">✓ Guardado</div>
  `;
}

function updateChampion(idx, field, value) {
  const cliente = state.currentCliente;
  const info = state.clientesInfo[cliente] || {};
  const champions = parseChampions(info.champion);
  if (champions[idx]) champions[idx][field] = value;
  saveChampions(champions);
}

function addChampion() {
  const cliente = state.currentCliente;
  const info = state.clientesInfo[cliente] || {};
  const champions = parseChampions(info.champion);
  champions.push({ nombre: '', rol: 'Otro' });
  if (!state.clientesInfo[cliente]) state.clientesInfo[cliente] = {};
  state.clientesInfo[cliente].champion = JSON.stringify(champions);
  // Re-render solo el editor de champions
  const container = document.getElementById('champions-container');
  if (container) container.innerHTML = renderChampionsEditor(champions);
}

function removeChampion(idx) {
  const cliente = state.currentCliente;
  const info = state.clientesInfo[cliente] || {};
  const champions = parseChampions(info.champion);
  champions.splice(idx, 1);
  saveChampions(champions);
  const container = document.getElementById('champions-container');
  if (container) container.innerHTML = renderChampionsEditor(champions);
}

async function saveChampions(champions) {
  const cliente = state.currentCliente;
  if (!state.clientesInfo[cliente]) state.clientesInfo[cliente] = {};
  const val = JSON.stringify(champions);
  state.clientesInfo[cliente].champion = val;
  await apiPost({ action: 'actualizarClienteInfo', cliente, campo: 'champion', valor: val });
  const el = document.getElementById('champ-saved');
  if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); }
}

function renderInfoCliente() {
  const info = (state.clientesInfo[state.currentCliente]) || {};
  const champions = parseChampions(info.champion);
  return `
    <div class="info-grid">
      <div class="info-field">
        <div class="info-field-label">Gerencia / Vertical</div>
        <input class="info-field-value" value="${info.gerencia || ''}" placeholder="—" onblur="guardarInfoConFeedback(this, 'gerencia', this.value)">
        <div class="field-saved" id="saved-gerencia">✓ Guardado</div>
      </div>
      <div class="info-field">
        <div class="info-field-label">Gerente TSOFT ref.</div>
        <input class="info-field-value" value="${info.gerente || ''}" placeholder="—" onblur="guardarInfoConFeedback(this, 'gerente', this.value)">
        <div class="field-saved" id="saved-gerente">✓ Guardado</div>
      </div>
      <div class="info-field full" id="champions-container">
        <div class="info-field-label">Champions asignados</div>
        ${renderChampionsEditor(champions)}
      </div>
      <div class="info-field">
        <div class="info-field-label">Nivel C</div>
        <input class="info-field-value" value="${info.nivelC || ''}" placeholder="C1 / C2 / C3 / C4" onblur="guardarInfoConFeedback(this, 'nivelC', this.value)">
        <div class="field-saved" id="saved-nivelC">✓ Guardado</div>
      </div>
      <div class="info-field">
        <div class="info-field-label">Nivel P actual</div>
        <input class="info-field-value" value="${info.nivelP || ''}" placeholder="P1 / P2 / P3..." onblur="guardarInfoConFeedback(this, 'nivelP', this.value)">
        <div class="field-saved" id="saved-nivelP">✓ Guardado</div>
      </div>
      <div class="info-field full">
        <div class="info-field-label">Herramientas IA en uso</div>
        <input class="info-field-value" value="${info.herramientas || ''}" placeholder="—" onblur="guardarInfoConFeedback(this, 'herramientas', this.value)">
        <div class="field-saved" id="saved-herramientas">✓ Guardado</div>
      </div>
      <div class="info-field full">
        <div class="info-field-label">Próximo paso</div>
        <textarea class="info-field-value" rows="2" placeholder="—" onblur="guardarInfoConFeedback(this, 'proximoPaso', this.value)">${info.proximoPaso || ''}</textarea>
        <div class="field-saved" id="saved-proximoPaso">✓ Guardado</div>
      </div>
      <div class="info-field full">
        <div class="info-field-label">Notas clave</div>
        <textarea class="info-field-value" rows="3" placeholder="—" onblur="guardarInfoConFeedback(this, 'notas', this.value)">${info.notas || ''}</textarea>
        <div class="field-saved" id="saved-notas">✓ Guardado</div>
      </div>
    </div>
  `;
}

// ============================================================
// ACCIONES
// ============================================================
async function cambiarEstado(tareaId, nuevoEstado, selectEl) {
  selectEl.className = `estado-select ${nuevoEstado.replace(' ', '-')}`;

  // Update texto visual
  const textoEl = document.getElementById('texto-' + tareaId);
  if (textoEl) {
    textoEl.classList.toggle('done', nuevoEstado === 'Completado');
  }

  // Update local state
  const cliente = state.currentCliente;
  const faseId = state.currentFase;
  if (state.tareas[cliente] && state.tareas[cliente][faseId]) {
    const t = state.tareas[cliente][faseId].find(x => x.id === tareaId);
    if (t) t.estado = nuevoEstado;
  }

  await apiPost({ action: 'actualizarEstado', tareaId, estado: nuevoEstado });
  toast('Estado actualizado');
  renderFaseStats();
}

async function agregarTarea() {
  const input = document.getElementById('nueva-tarea-input');
  const texto = input.value.trim();
  if (!texto) return;

  const cliente = state.currentCliente;
  const faseId = state.currentFase;

  const result = await apiPost({ action: 'agregarTarea', ola: state.currentOla, cliente, faseId, texto });

  if (result.success) {
    if (!state.tareas[cliente]) state.tareas[cliente] = {};
    if (!state.tareas[cliente][faseId]) state.tareas[cliente][faseId] = [];
    state.tareas[cliente][faseId].push({ id: result.id, texto, estado: 'Pendiente', notas: '' });
    input.value = '';
    renderFasePanel();
    toast('Tarea agregada');
  }
}

async function eliminarTarea(tareaId) {
  if (!confirm('¿Eliminar esta tarea?')) return;

  await apiPost({ action: 'eliminarTarea', tareaId });

  const cliente = state.currentCliente;
  const faseId = state.currentFase;
  if (state.tareas[cliente] && state.tareas[cliente][faseId]) {
    state.tareas[cliente][faseId] = state.tareas[cliente][faseId].filter(t => t.id !== tareaId);
  }

  renderFasePanel();
  toast('Tarea eliminada');
}

async function guardarInfo(campo, valor) {
  const cliente = state.currentCliente;
  if (!state.clientesInfo[cliente]) state.clientesInfo[cliente] = {};
  state.clientesInfo[cliente][campo] = valor;
  await apiPost({ action: 'actualizarClienteInfo', cliente, campo, valor });
  toast('Guardado');
}

async function guardarInfoConFeedback(inputEl, campo, valor) {
  const cliente = state.currentCliente;
  if (!state.clientesInfo[cliente]) state.clientesInfo[cliente] = {};
  state.clientesInfo[cliente][campo] = valor;
  await apiPost({ action: 'actualizarClienteInfo', cliente, campo, valor });
  const saved = document.getElementById('saved-' + campo);
  if (saved) { saved.classList.add('show'); setTimeout(() => saved.classList.remove('show'), 2000); }
}

function renderFaseStats() {
  // Refresh mini badges sin re-render completo
  const cliente = state.currentCliente;
  const faseId = state.currentFase;
  const tareas = (state.tareas[cliente] || {})[faseId] || [];
  const completadas = tareas.filter(t => t.estado === 'Completado').length;
  const enCurso = tareas.filter(t => t.estado === 'En curso').length;
  const pendientes = tareas.filter(t => t.estado === 'Pendiente').length;
  const stats = document.querySelector('.fase-panel-stats');
  if (stats) {
    stats.innerHTML = `
      <span class="mini-badge mb-green">${completadas} ✓</span>
      <span class="mini-badge mb-yellow">${enCurso} ↻</span>
      <span class="mini-badge mb-gray">${pendientes} ·</span>
    `;
  }
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ============================================================
// INIT
// ============================================================
loadDashboard();
